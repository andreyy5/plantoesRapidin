{# Item do menu lateral. Parâmetros: url, chave, label, icone, badge (opcional) #}
<a href="{{ url }}"{% if chave == nav_ativo %} aria-current="page"{% endif %}
   class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-medium transition-all
          {% if chave == nav_ativo %}bg-[#E94920] text-white shadow-lg shadow-[#E94920]/25{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
  {% include 'partials/icon.html' with nome=icone classe='w-4 h-4 shrink-0' %}
  <span class="flex-1 truncate">{{ label }}</span>
  {% if badge %}
  <span class="min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center" aria-label="{{ badge }} não lidas">{{ badge }}</span>
  {% endif %}
</a>
